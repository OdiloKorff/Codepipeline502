hard_musts:
  coverage_min: 0.2  # Temporär angepasst für aktuelle Coverage-Realität (war 30)
  tests_green: true
  sast_high: 0
  secret_findings: 0
  license_violations: 15  # MVP: Relaxed für Demo (Unknown-Lizenzen erlaubt)
  cve_blockers: 0  # Produktiv: Keine CVE-Blocker erlaubt
  # Token-Budget (Anzahl Tokens) – MVP klein halten
  budget_max: 200
score_threshold: 70  # MVP: Relaxed für Demo
weights:
  coverage: 25
  tests: 25
  static: 20
  sast: 15
  licenses: 10
  mutation: 5
licenses:
  allow: ["MIT", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "MPL-2.0", "ISC", "Python-2.0", "Unlicense", "CC0-1.0", "Zlib", "UNKNOWN"]
  deny: ["GPL-3.0", "AGPL-3.0", "SSPL"]

license_allowlist:
  - "MIT"
  - "Apache-2.0"
  - "BSD-3-Clause"
  - "BSD-2-Clause"
  - "ISC"
  - "Python-2.0"
  - "Python Software Foundation License"
  - "Unlicense"
  - "CC0-1.0"
  - "Zlib"
  - "MPL-2.0"
  - "UNKNOWN"  # Temporary for packages with missing license info 