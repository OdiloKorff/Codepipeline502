[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepipeline"
version = "0.1.0"
requires-python = ">=3.11"
description = "Autonome CodePipeline (MVP) – Prompt → Code → Tests → Score → Artefakt"
readme = "README.md"
license = "MIT"
authors = [{ name = "Your Name" }]

dependencies = [
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.26",
  "openai>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "coverage>=7.6",
  "ruff>=0.5",
  "mypy>=1.10",
  "semgrep>=1.84",
  "commitizen>=3.30",
  "pip-licenses>=4.4",
  "cyclonedx-bom>=4.0",
]

[project.scripts]
codepipeline = "codepipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*", ".github*", "*.pyc", "__pycache__*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4"]
ignore = ["E501","B008","C901","E402","I001"]  # Temporarily ignore E402/I001 for MVP

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --cov=codepipeline --cov-report=xml"
testpaths = ["Codepipeline502/Codepipeline502/tests", "codepipeline/tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"
update_changelog_on_bump = true