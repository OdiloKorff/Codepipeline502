[mypy]
# Mypy Basic-Mode Konfiguration für MVP
python_version = 3.10

# Basic-Mode: Weniger strenge Prüfungen
ignore_missing_imports = True
follow_imports = skip

# Strenge Warnungen deaktivieren für MVP
disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = False
warn_return_any = False
warn_unreachable = False
strict_optional = False

# Scope auf Hauptpaket begrenzen
files = codepipeline

# Störquellen ausschließen (vereinfacht)
exclude = build/|dist/|\.venv/|venv/|\.git/|__pycache__/|reports/

# Spezifische Module-Konfiguration
[mypy-codepipeline.*]
ignore_errors = False

[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True